# Component manifest for the AAC Automation Orchestrator workflows.
# GENERATED by scripts/ao_components.py from workflows/*.json — edit only the
# `provenance` block and the id -> name/type fields under `environment_ids`
# (they cannot be derived from the JSON); everything else is rewritten on each
# run. The UUIDs below are AO object identifiers from the lab, not secrets: a
# loader replaces every one of them with the target environment's own ID,
# resolved by name (see README.md).
provenance:
  exported_on: '2026-10-08'
  source: lab AO (ao-automation-orchestrator, namespace automation-orchestrator)
  api: GET /api/v1/workflows/<id>/versions/<current_version> -> .workflow_definition
  lab_versions:
    AAC — AMI Golden Meter (governed, AO): 4
    AAC - GPU Cross-Domain Flex (governed, lab AAP): 13
    AAC - Golden Image (governed drift, lab AAP): 14
    AAC - TEST call workflow-template via AO: 2
    'AAC - Tanium Comparison: Governed Drift (lab AAP)': 10
    AAC - Mythos Patch (governed + OPA, lab AAP): 18
  changes_since_export:
    - 'aac_mythos_patch_governed_opa_lab_aap.json: final_gate now passes each gate''s body.result.flags
      into input.assessments.<dim>.flags (the routing policy carries them into decision.flags; the lab
      v18 body omitted them)'
    - 'aac_test_call_workflow_template_via_ao.json: call_wf extra_vars key renamed target_hostname ->
      target_host, the variable AAC_GoldenImage_Enforcement and its Golden Image templates consume'
