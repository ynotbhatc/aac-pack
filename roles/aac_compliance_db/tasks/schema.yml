# ── compliance_certifications ──────────────────────────────────────────────────
# Certifiable Audit Artifact (CAA) storage. See docs/strategy/AAC_CERTIFIABLE_AUDIT_ARTIFACT_SPEC.md §3.1.
# Additive to compliance_results — every CAA writer also writes a compliance_results row.

- name: Create compliance_certifications table
  community.postgresql.postgresql_query:
    login_host: "{{ pg_host }}"
    login_port: "{{ pg_port | default(5432) }}"
    login_user: "{{ pg_user }}"
    login_password: "{{ aac_db_password }}"
    db: "{{ pg_db }}"
    query: |
      CREATE TABLE IF NOT EXISTS compliance_certifications (
        certification_id        UUID PRIMARY KEY,
        framework               VARCHAR(100) NOT NULL,
        framework_version       VARCHAR(50),
        scope                   VARCHAR(20)  NOT NULL,
        scope_value             TEXT         NOT NULL,
        period_start            TIMESTAMPTZ  NOT NULL,
        period_end              TIMESTAMPTZ  NOT NULL,
        evaluator_aap_job_id    INTEGER      NOT NULL,
        evaluator_aap_host      VARCHAR(255),
        policy_library_sha      TEXT         NOT NULL,
        opa_bundle_revision     VARCHAR(255),
        input_hash              CHAR(64)     NOT NULL,
        result                  JSONB        NOT NULL,
        regulatory_clauses      TEXT[]       NOT NULL DEFAULT '{}',
        compliance_status       VARCHAR(20)  NOT NULL,
        severity_summary        JSONB,
        signature               BYTEA        NOT NULL,
        signature_algorithm     VARCHAR(50)  NOT NULL,
        signed_by               VARCHAR(255) NOT NULL,
        signed_at               TIMESTAMPTZ  NOT NULL,
        artifact_uri            TEXT,
        superseded_by           UUID REFERENCES compliance_certifications(certification_id),
        signed_projection       TEXT,
        created_at              TIMESTAMPTZ  NOT NULL DEFAULT NOW()
      )

- name: Create compliance_certifications indexes
  community.postgresql.postgresql_query:
    login_host: "{{ pg_host }}"
    login_port: "{{ pg_port | default(5432) }}"
    login_user: "{{ pg_user }}"
    login_password: "{{ aac_db_password }}"
    db: "{{ pg_db }}"
    query: "{{ item }}"
  loop:
    - "CREATE INDEX IF NOT EXISTS idx_caa_framework_scope     ON compliance_certifications(framework, scope, scope_value)"
    - "CREATE INDEX IF NOT EXISTS idx_caa_period              ON compliance_certifications(period_start, period_end)"
    - "CREATE INDEX IF NOT EXISTS idx_caa_evaluator_job       ON compliance_certifications(evaluator_aap_job_id)"
    - "CREATE INDEX IF NOT EXISTS idx_caa_regulatory_clauses  ON compliance_certifications USING gin(regulatory_clauses)"
  failed_when: false

# Widen policy_library_sha from VARCHAR(40) to TEXT. Original schema assumed a
# raw 40-char SHA, but the resolver now emits "project:<40-char-hex>" (48 chars)
# when it falls back to AAP's parent-repo revision — see aac_store_certification/
# tasks/main.yml. TEXT keeps future markers open (e.g. "bundle:<sha>",
# "cosign:<digest>") without additional migrations.
- name: Widen policy_library_sha column to TEXT (migration)
  community.postgresql.postgresql_query:
    login_host: "{{ pg_host }}"
    login_port: "{{ pg_port | default(5432) }}"
    login_user: "{{ pg_user }}"
    login_password: "{{ aac_db_password }}"
    db: "{{ pg_db }}"
    query: |
      ALTER TABLE compliance_certifications
        ALTER COLUMN policy_library_sha TYPE TEXT
  failed_when: false

# signed_projection stores the exact JSON bytes that cosign signed. Without
# this, verification by an external auditor requires reconstructing the
# canonical projection from other columns — which is fragile (PG's JSONB
# round-trip doesn't preserve byte-for-byte formatting, and timestamp
# serialization can vary). Storing the bytes makes cosign verify-blob a pure
# lookup: fetch signed_projection + signature, run cosign, done.
- name: Add signed_projection column (migration)
  community.postgresql.postgresql_query:
    login_host: "{{ pg_host }}"
    login_port: "{{ pg_port | default(5432) }}"
    login_user: "{{ pg_user }}"
    login_password: "{{ aac_db_password }}"
    db: "{{ pg_db }}"
    query: |
      ALTER TABLE compliance_certifications
        ADD COLUMN IF NOT EXISTS signed_projection TEXT
  failed_when: false

